name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could JobFlow solve it? Note any interaction with the invariants in CONTRIBUTING.md (tier boundary, never-submit, grounded generation, soft ranking).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
