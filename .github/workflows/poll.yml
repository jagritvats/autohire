name: jobflow-poll

# Cloud cron (Tier 1-2 only). Discovers + polls ATS boards + aggregators, then
# re-ranks. Free GitHub Actions minutes; no infra (§8, §9, §12-Q1).
# Tier 3 (Naukri/Glassdoor/AmbitionBox/LinkedIn) NEVER runs here — local agent only.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h
  workflow_dispatch: {}

concurrency:
  group: jobflow-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # the repo factory persists only when DATABASE_URL is set (a HOSTED Postgres —
      # a localhost/Docker DB is unreachable from Actions; there the worker runner's
      # built-in scheduler keeps the corpus fresh instead). Without it this run is in-memory.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'echo' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # optional discovery APIs — each feed is a no-op until its secret exists
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      # PAID: every cron run is a fresh process, so JSearch's once-per-JSEARCH_MIN_HOURS
      # guard doesn't carry over — with a key set it's called on every 6-hourly run
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      JSEARCH_RAPIDAPI_KEY: ${{ secrets.JSEARCH_RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: discover + poll + rank
        run: pnpm --filter @jobflow/worker start
