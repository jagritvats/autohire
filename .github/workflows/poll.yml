name: jobflow-poll

# Cloud cron (Tier 1-2 only). Discovers + polls ATS boards + aggregators, then
# re-ranks and enriches. Free GitHub Actions minutes; no infra (§8, §9, §12-Q1).
# Tier 3 (Naukri/Glassdoor/AmbitionBox/LinkedIn) NEVER runs here — local agent only.
#
# A scheduled run only makes sense against a HOSTED Postgres (the DATABASE_URL secret):
# The secret must include ?sslmode=require for hosted Postgres — TLS follows sslmode only.
# without one the worker falls back to an in-memory store that dies with the runner, so a
# cron poll would hit every board every 6h and persist nothing. The gate job skips those
# runs; "Run workflow" (workflow_dispatch) always goes ahead, as an end-to-end smoke test.
#
# FORKS: GitHub disables scheduled workflows on forks. To use this cron on your fork,
# enable Actions in the fork's "Actions" tab and add the secrets below (at least
# DATABASE_URL); optional repository variables: LLM_PROVIDER, LLM_MODEL_CHEAP,
# LLM_MODEL_STRONG, JOBFLOW_POLL_COUNTRY, JOBFLOW_RERANK_TOP.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6h
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: jobflow-poll
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$HAS_DB" = "true" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No DATABASE_URL secret: a scheduled poll into an in-memory store would persist nothing, so it is skipped. Add the secret (a hosted Postgres) to enable the cron; 'Run workflow' still runs as a smoke test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  poll:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # the repo factory persists only when DATABASE_URL is set (a HOSTED Postgres —
      # a localhost/Docker DB is unreachable from Actions; there the worker runner's
      # built-in scheduler keeps the corpus fresh instead). Without it this run is in-memory.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'echo' }}
      # blank → the provider's default models
      LLM_MODEL_CHEAP: ${{ vars.LLM_MODEL_CHEAP }}
      LLM_MODEL_STRONG: ${{ vars.LLM_MODEL_STRONG }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      JOBFLOW_POLL_COUNTRY: ${{ vars.JOBFLOW_POLL_COUNTRY || 'IN' }}
      JOBFLOW_RERANK_TOP: ${{ vars.JOBFLOW_RERANK_TOP || '15' }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      # optional discovery APIs — each feed is a no-op until its secret exists
      CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
      # PAID: every cron run is a fresh process, so JSearch's once-per-JSEARCH_MIN_HOURS
      # guard doesn't carry over — with a key set it's called on every 6-hourly run
      JSEARCH_API_KEY: ${{ secrets.JSEARCH_API_KEY }}
      JSEARCH_RAPIDAPI_KEY: ${{ secrets.JSEARCH_RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      # no `version:` — the action reads package.json's "packageManager" (pnpm@9.15.9).
      # Pinning "9" here too made action-setup@v4 abort every run: it refuses two versions
      # that aren't the identical string ("9" ≠ "9.15.9").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No build step: the worker runs through tsx on the workspace packages' TS sources
      # (their package.json "main" points at src/). `pnpm -r build` also ran `next build`
      # for the web app — minutes of CI time this job never used.
      # a hosted DB must have the schema the code writes (e.g. 0013's salary columns);
      # the migrator is idempotent and tracks what it has applied
      - name: migrate
        if: env.DATABASE_URL != ''
        run: pnpm --filter @jobflow/db migrate
      - name: discover + poll + rank + enrich
        run: pnpm --filter @jobflow/worker start
