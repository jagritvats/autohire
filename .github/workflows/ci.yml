name: ci

# Build, typecheck and test every workspace package on each PR and on pushes to main.
# Offline by design: tests use the echo LLM provider and the in-memory store, so no
# secrets are needed (forks' PRs run the same).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Node 22 is the full run (every package built, incl. `next build`). The Node 20 leg holds
    # the engines floor (>=20.11): it builds the libraries (the web app's TS still typechecks
    # and its tests still run, just not `next build`), then typechecks and tests everything.
    name: build-test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 20]
    env:
      LLM_PROVIDER: echo
      # makes the real-browser "never submits" test FAIL rather than skip when it can't
      # launch Chromium (packages/autofill/test/browser-fill.e2e.test.ts), so invariant #2's
      # end-to-end proof can't silently drop out of CI (GitHub sets CI=true too)
      JOBFLOW_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      # no `version:` — pnpm/action-setup reads package.json's "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Chromium (+ its system libraries) for the e2e autofill test, from the repo's own
      # pinned Playwright (root devDependency), so browser and driver always match
      - name: Install Chromium for the real-browser test
        run: pnpm exec playwright install --with-deps chromium
      - name: Build
        if: matrix.node == 22
        run: pnpm -r build
      - name: Build (libraries only)
        if: matrix.node != 22
        run: pnpm -r --filter '!@jobflow/web' build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # the video pipeline's own unit tests (node:test; no ffmpeg/network needed)
      - name: Video tests
        if: matrix.node == 22
        run: pnpm video:test

  guards:
    # privacy + tenant-isolation regression guards (no install needed: plain node scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: No personal data in tracked files
        run: node scripts/check-pii.mjs
      - name: Every API route resolves its caller
        run: node scripts/check-tenant.mjs
